name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate project files
        run: |
          plutil -lint Supporting/Info.plist
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Run tests
        run: swift test
